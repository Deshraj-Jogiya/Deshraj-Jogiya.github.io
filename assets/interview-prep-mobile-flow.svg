<text x="22" y="107" font-size="17" font-weight="700" fill="#e6edf3">App screen</text>
<text x="22" y="128" font-size="13" fill="#9198a1">browse and answer</text>
<text x="22" y="145" font-size="13" fill="#9198a1">interview questions</text>
