<text x="22" y="92" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">SEEDED</text>
<text x="22" y="115" font-size="18" font-weight="700" fill="#e6edf3">Generate</text>
<text x="22" y="136" font-size="13.5" fill="#9198a1">60,000 postings, 400</text>
<text x="22" y="153" font-size="13.5" fill="#9198a1">companies as raw CSV</text>
<rect x="246" y="70" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="260" y="92" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">PYSPARK</text>
<text x="260" y="115" font-size="18" font-weight="700" fill="#e6edf3">Transform</text>
<text x="260" y="136" font-size="13.5" fill="#9198a1">join, salary stats,</text>
<text x="260" y="153" font-size="13.5" fill="#9198a1">dense_rank(); Parquet</text>
<rect x="484" y="70" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="498" y="92" font-size="11" font-weight="700" letter-spacing="1.1" fill="#f59e0b">GREAT EXPECTATIONS</text>
