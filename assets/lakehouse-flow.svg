<text x="498" y="136" font-size="13.5" fill="#9198a1">11 checks; any failure</text>
<text x="498" y="153" font-size="13.5" fill="#9198a1">stops the run</text>
<rect x="722" y="70" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
