<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect width="960" height="350" fill="#0d1117"/>
<text x="8" y="30" font-size="16" font-weight="700" fill="#e6edf3">How a posting flows through the reactive gateway</text>
<rect x="8" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="22" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">CLIENT</text>
<text x="22" y="107" font-size="17" font-weight="700" fill="#e6edf3">POST /postings</text>
<text x="22" y="128" font-size="13" fill="#9198a1">a new job posting</text>
<text x="22" y="145" font-size="13" fill="#9198a1">sent over HTTP</text>
<rect x="246" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="260" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">SPRING WEBFLUX</text>
<text x="260" y="107" font-size="17" font-weight="700" fill="#e6edf3">Controller</text>
<text x="260" y="128" font-size="13" fill="#9198a1">non-blocking request</text>
<text x="260" y="145" font-size="13" fill="#9198a1">handling</text>
<rect x="484" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">SERVICE</text>
<text x="498" y="107" font-size="17" font-weight="700" fill="#e6edf3">JobPostingService</text>
<text x="498" y="128" font-size="13" fill="#9198a1">saves the posting and</text>
<text x="498" y="145" font-size="13" fill="#9198a1">publishes it</text>
<rect x="722" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="736" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#60a5fa">R2DBC</text>
<text x="736" y="107" font-size="17" font-weight="700" fill="#e6edf3">Repository</text>
<text x="736" y="128" font-size="13" fill="#9198a1">reactive database</text>
<text x="736" y="145" font-size="13" fill="#9198a1">writes</text>
<rect x="484" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#a78bfa">PROJECT REACTOR</text>
<text x="498" y="257" font-size="17" font-weight="700" fill="#e6edf3">Sinks.Many replay</text>
<text x="498" y="278" font-size="13" fill="#9198a1">keeps recent postings</text>
<text x="498" y="295" font-size="13" fill="#9198a1">for late subscribers</text>
<rect x="722" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="736" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#f59e0b">SERVER-SENT EVENTS</text>
<text x="736" y="257" font-size="17" font-weight="700" fill="#e6edf3">Live subscribers</text>
<text x="736" y="278" font-size="13" fill="#9198a1">text/event-stream,</text>
<text x="736" y="295" font-size="13" fill="#9198a1">history then live</text>
<path d="M218 111L242 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M456 111L480 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M694 111L718 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M589 160L589 208" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M694 261L718 261" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
</svg>
