<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect width="960" height="350" fill="#0d1117"/>
<text x="8" y="30" font-size="16" font-weight="700" fill="#e6edf3">How Company Search updates without a JavaScript framework</text>
<rect x="8" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="22" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">BROWSER + HTMX</text>
<text x="22" y="107" font-size="17" font-weight="700" fill="#e6edf3">Search box</text>
<text x="22" y="128" font-size="13" fill="#9198a1">debounced on input,</text>
<text x="22" y="145" font-size="13" fill="#9198a1">not just keyup</text>
<rect x="246" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="260" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">FASTAPI</text>
<text x="260" y="107" font-size="17" font-weight="700" fill="#e6edf3">Search endpoint</text>
<text x="260" y="128" font-size="13" fill="#9198a1">renders an HTML</text>
<text x="260" y="145" font-size="13" fill="#9198a1">fragment with Jinja2</text>
<rect x="484" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#60a5fa">SQLITE</text>
<text x="498" y="107" font-size="17" font-weight="700" fill="#e6edf3">Companies</text>
<text x="498" y="128" font-size="13" fill="#9198a1">queried by name</text>
<text x="498" y="145" font-size="13" fill="#9198a1"></text>
<rect x="8" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="22" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#a78bfa">SWAP</text>
<text x="22" y="257" font-size="17" font-weight="700" fill="#e6edf3">Results fragment</text>
<text x="22" y="278" font-size="13" fill="#9198a1">replaces the list</text>
<text x="22" y="295" font-size="13" fill="#9198a1">in place</text>
<rect x="246" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="260" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">INLINE EDIT</text>
<text x="260" y="257" font-size="17" font-weight="700" fill="#e6edf3">Toggle sponsorship</text>
<text x="260" y="278" font-size="13" fill="#9198a1">updates one row and</text>
<text x="260" y="295" font-size="13" fill="#9198a1">returns its fragment</text>
<rect x="484" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#f59e0b">SERVER-SENT EVENTS</text>
<text x="498" y="257" font-size="17" font-weight="700" fill="#e6edf3">Refresh other tabs</text>
<text x="498" y="278" font-size="13" fill="#9198a1">every open tab</text>
<text x="498" y="295" font-size="13" fill="#9198a1">reloads its list</text>
<path d="M218 111L242 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M456 111L480 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M351 160L117 211" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M456 261L480 261" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
</svg>
