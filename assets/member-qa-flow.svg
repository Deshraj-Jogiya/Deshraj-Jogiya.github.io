<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect width="960" height="350" fill="#0d1117"/>
<text x="8" y="30" font-size="16" font-weight="700" fill="#e6edf3">How the Member Messages QA system answers a question</text>
<rect x="8" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="22" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">INPUT</text>
<text x="22" y="107" font-size="17" font-weight="700" fill="#e6edf3">Question</text>
<text x="22" y="128" font-size="13" fill="#9198a1">in plain English</text>
<text x="22" y="145" font-size="13" fill="#9198a1"></text>
<rect x="246" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="260" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">SPACY NER</text>
<text x="260" y="107" font-size="17" font-weight="700" fill="#e6edf3">Who is it about?</text>
<text x="260" y="128" font-size="13" fill="#9198a1">names matched with</text>
<text x="260" y="145" font-size="13" fill="#9198a1">fuzzy first names</text>
<rect x="484" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">SENTENCE-TRANSFORMERS</text>
<text x="498" y="107" font-size="17" font-weight="700" fill="#e6edf3">Rank messages</text>
<text x="498" y="128" font-size="13" fill="#9198a1">cosine similarity of</text>
<text x="498" y="145" font-size="13" fill="#9198a1">MiniLM embeddings</text>
<rect x="722" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="736" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#60a5fa">OUTPUT</text>
<text x="736" y="107" font-size="17" font-weight="700" fill="#e6edf3">Answer</text>
<text x="736" y="128" font-size="13" fill="#9198a1">extracted from the</text>
<text x="736" y="145" font-size="13" fill="#9198a1">best message</text>
<rect x="484" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#a78bfa" stroke-dasharray="6 5" stroke-width="1.3"/>
<text x="498" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#a78bfa">ALTERNATIVES</text>
<text x="498" y="257" font-size="17" font-weight="700" fill="#e6edf3">Same retrieval via</text>
<text x="498" y="278" font-size="13" fill="#9198a1">LangChain RAG, LlamaIndex,</text>
<text x="498" y="295" font-size="13" fill="#9198a1">Semantic Kernel plugins</text>
<rect x="722" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="736" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#f59e0b">EVALUATION</text>
<text x="736" y="257" font-size="17" font-weight="700" fill="#e6edf3">26 labelled questions</text>
<text x="736" y="278" font-size="13" fill="#9198a1">right member 100%,</text>
<text x="736" y="295" font-size="13" fill="#9198a1">right answer 96%</text>
<path d="M218 111L242 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M456 111L480 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M694 111L718 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M589 160L589 208" stroke="#6e7681" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
