<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect width="960" height="350" fill="#0d1117"/>
<text x="8" y="30" font-size="16" font-weight="700" fill="#e6edf3">How the Interview Prep API serves a question</text>
<rect x="8" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="22" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">CLIENT</text>
<text x="22" y="107" font-size="17" font-weight="700" fill="#e6edf3">Web or mobile app</text>
<text x="22" y="128" font-size="13" fill="#9198a1">asks for a question,</text>
<text x="22" y="145" font-size="13" fill="#9198a1">records an attempt</text>
<rect x="246" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="260" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#2dd4bf">ASP.NET CORE</text>
<text x="260" y="107" font-size="17" font-weight="700" fill="#e6edf3">Minimal API</text>
<text x="260" y="128" font-size="13" fill="#9198a1">C# endpoints with</text>
<text x="260" y="145" font-size="13" fill="#9198a1">filtering and random pick</text>
<rect x="484" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#60a5fa">EF CORE</text>
<text x="498" y="107" font-size="17" font-weight="700" fill="#e6edf3">DbContext</text>
<text x="498" y="128" font-size="13" fill="#9198a1">schema and seeding</text>
<text x="498" y="145" font-size="13" fill="#9198a1">managed in code</text>
<rect x="722" y="62" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="736" y="84" font-size="11" font-weight="700" letter-spacing="1.1" fill="#60a5fa">SQLITE</text>
<text x="736" y="107" font-size="17" font-weight="700" fill="#e6edf3">Database</text>
<text x="736" y="128" font-size="13" fill="#9198a1">questions and</text>
<text x="736" y="145" font-size="13" fill="#9198a1">attempt history</text>
<rect x="246" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="260" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#a78bfa">SCHEDULER</text>
<text x="260" y="257" font-size="17" font-weight="700" fill="#e6edf3">SM-2</text>
<text x="260" y="278" font-size="13" fill="#9198a1">spaced repetition picks</text>
<text x="260" y="295" font-size="13" fill="#9198a1">when to ask again</text>
<rect x="484" y="212" width="210" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="498" y="234" font-size="11" font-weight="700" letter-spacing="1.1" fill="#f59e0b">TESTS</text>
<text x="498" y="257" font-size="17" font-weight="700" fill="#e6edf3">19 xUnit tests</text>
<text x="498" y="278" font-size="13" fill="#9198a1">12 integration tests on</text>
<text x="498" y="295" font-size="13" fill="#9198a1">in-memory SQLite</text>
<path d="M218 111L242 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M456 111L480 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M694 111L718 111" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M351 160L351 208" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
</svg>
