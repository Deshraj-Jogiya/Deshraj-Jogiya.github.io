    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <link rel="canonical" href="{{ site_url }}{{ page_path }}">
    <meta name="author" content="Deshraj Jogiya">
    <meta name="theme-color" content="#0f172a">
    <!-- Link previews (LinkedIn, Slack, email) -->
    <meta property="og:type" content="{{ og_type | default('website') }}">
    <meta property="og:site_name" content="Deshraj Jogiya">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ site_url }}{{ page_path }}">
    <meta property="og:image" content="{{ site_url }}/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Deshraj Jogiya, Data Engineer and Machine Learning Engineer">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ page_description }}">
    <meta name="twitter:image" content="{{ site_url }}/assets/og-image.png">
    {% if google_site_verification %}<meta name="google-site-verification" content="{{ google_site_verification }}">{% endif %}
    {% if json_ld %}<script type="application/ld+json">{{ json_ld | safe }}</script>{% endif %}
