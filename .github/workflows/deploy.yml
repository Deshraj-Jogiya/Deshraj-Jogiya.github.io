name: Deploy Portfolio Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Jinja2

      - name: Compile HTML with Python
        run: python build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository contents (index.html, style.css, app.js, assets/)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Clear chatbot cache if projects.json changed
        # Only clears on an actual data change, not every push -- a
        # time-based cache expiry would mean paying for more LLM calls
        # than necessary; this only invalidates when there's a real
        # reason to, keeping the free-tier cost model intact.
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^projects.json$' || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "projects.json changed -- clearing chatbot_cache"
            curl -sf -X POST "https://mtvcrttbdjwcixzhlkvo.supabase.co/functions/v1/clear-chatbot-cache" \
              -H "Authorization: Bearer ${{ secrets.CACHE_CLEAR_TOKEN }}"
          else
            echo "projects.json unchanged -- leaving chatbot_cache alone"
          fi
